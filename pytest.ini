[pytest]
minversion = 8.0
pythonpath = .
testpaths = tests
python_files = test_aiza_*.py
addopts = -ra --strict-markers
markers =
    smoke: quick sanity tests that run first
    regression: full regression suite (every test)
    stack: tests for the Stack class
    prime: tests for the is_prime function
    queue: tests for the CircularQueue class
    data_driven: tests that read their data from CSV files
